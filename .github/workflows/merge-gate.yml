name: merge-gate

# Required merge-queue check. Static behavior specs run under both supported
# PowerShell runtimes; live Azure/network specs are tagged Integration and excluded.
on:
  pull_request:
  merge_group:

permissions:
  contents: read

jobs:
  gate:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: PSScriptAnalyzer (fail on Error; report Warnings)
        shell: pwsh
        run: |
          Set-PSRepository -Name PSGallery -InstallationPolicy Trusted -ErrorAction SilentlyContinue
          Install-Module PSScriptAnalyzer -Scope CurrentUser -Force -SkipPublisherCheck
          # Standard AMN exclusion list (STANDARD.md R11).
          # PSUseBOMForUnicodeEncodedFile remains enabled for this variant.
          $exclude = @(
            'PSAvoidUsingWriteHost',
            'PSUseShouldProcessForStateChangingFunctions',
            'PSUseSingularNouns',
            'PSAvoidUsingConvertToSecureStringWithPlainText',
            'PSAvoidUsingPositionalParameters'
          )
          $paths = @('Run-Tests.ps1', 'client', 'identity', 'test-harness', 'tests')
          $findings = @(
            foreach ($path in $paths) {
              Invoke-ScriptAnalyzer -Path $path -Recurse -ExcludeRule $exclude -ErrorAction SilentlyContinue
            }
          )
          $findings | Sort-Object Severity, ScriptName, Line |
            Format-Table Severity, RuleName, ScriptName, Line -AutoSize |
            Out-String |
            Write-Host
          $errorCount = @($findings | Where-Object Severity -eq 'Error').Count
          if ($errorCount -gt 0) {
            throw "PSScriptAnalyzer reported $errorCount error(s)."
          }

      - name: Install Pester 5
        shell: pwsh
        run: |
          Set-PSRepository -Name PSGallery -InstallationPolicy Trusted -ErrorAction SilentlyContinue
          Install-Module Pester -MinimumVersion 5.0.0 -MaximumVersion 5.99.99 -Scope CurrentUser -Force -SkipPublisherCheck

      - name: Pester gate - PowerShell 7
        shell: pwsh
        run: ./Run-Tests.ps1 -Detailed

      - name: Pester gate - Windows PowerShell 5.1
        shell: powershell
        run: |
          [Net.ServicePointManager]::SecurityProtocol = [Net.SecurityProtocolType]::Tls12
          Set-PSRepository -Name PSGallery -InstallationPolicy Trusted -ErrorAction SilentlyContinue
          Install-Module Pester -MinimumVersion 5.0.0 -MaximumVersion 5.99.99 -Scope CurrentUser -Force -SkipPublisherCheck
          .\Run-Tests.ps1 -Detailed
